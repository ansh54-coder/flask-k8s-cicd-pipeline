apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopapi
  namespace: shopapi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopapi

  minReplicas: 2
  maxReplicas: 10

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
