apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopapi
  namespace: shopapi
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopapi
                port:
                  number: 80
